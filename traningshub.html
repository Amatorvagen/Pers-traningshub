/* ── Programoverstyrningar ──
   PROGRAM_PLAN ar utgangslaget. Allt som Per eller en Claude-chatt skriver om
   sparas i app_state-nyckeln "goals" under prog_<id> och vinner over
   grundtexten. Tom strang betyder medvetet tomt, inte "ingen overstyrning",
   sa ett falt gar att rensa. */
const PROG_FIELDS = ["period","dateEnd","structure","startGoal","endGoal","progression","notes","status"];
function mergeProgram(prog, goals) {
const o = (goals && goals["prog_"+prog.id]) || {};
const out = {...prog};
for (const f of PROG_FIELDS) if (typeof o[f] === "string") out[f] = o[f];
return out;
}

/* ── Veckoplan ──
   Planen ar nyckelad pa ISO-vecka. Nar veckan tar slut slutar den visas.
   Det ar meningen: det tomma kortet ar paminnelsen om att summera veckan
   och lagga nasta. En gammal plan som ser aktuell ut ar varre an ingen. */
function isoWeek(d) {
const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
const day = t.getUTCDay() || 7;
t.setUTCDate(t.getUTCDate() + 4 - day);
const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
const w = Math.ceil(((t - y0) / 86400000 + 1) / 7);
return `${t.getUTCFullYear()}-W${String(w).padStart(2,"0")}`;
}
function currentWeek() { return isoWeek(new Date()); }
function weekLabel(key) { return key ? "v." + Number(key.split("-W")[1]) : ""; }


function passColor(type) {
if (type==="Övergång") return {bg:C.surfaceAlt,border:C.border,text:C.muted};
if (type==="Press")   return {bg:C.press,border:C.pressBorder,text:C.pressText};
if (type==="ABC")     return {bg:C.abc,border:C.abcBorder,text:C.abcText};
if (type==="WW")      return {bg:C.ww,border:C.wwBorder,text:C.wwText};
if (type==="Annat")   return {bg:C.other,border:C.otherBorder,text:C.otherText};
if (type==="Giant")   return {bg:"#F0EAF8",border:"#C8A8D8",text:"#4A1A78"};
return {bg:C.surface,border:C.border,text:C.text};
}

function formatDate(d) {
const days=["Sön","Mån","Tis","Ons","Tor","Fre","Lör"];
const months=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const date=new Date(d+"T12:00:00");
return `${days[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]}`;
}

/* ══════════ TCX-PARSER (Polar H10 pulsdata) ══════════ */
/* Nedsamplingsintervall i sekunder */
const HR_SAMPLE_SEC = 5;

/* Parsar en TCX-fil. Returnerar {ok:true, data:{...}} eller {ok:false, error:"..."} */
function parseTCX(xmlText, fileName) {
try {
if (!xmlText || xmlText.length < 100) return {ok:false, error:"Filen är tom eller för liten"};

const parser = new DOMParser();
const doc = parser.parseFromString(xmlText, "text/xml");

/* Kolla parsningsfel */
const perr = doc.querySelector("parsererror");
if (perr) return {ok:false, error:"Filen är inte giltig XML"};

/* Hitta alla trackpoints (namespace-agnostiskt via lokalt namn) */
const allEls = doc.getElementsByTagName("*");
const trackpoints = [];
for (let i=0;i<allEls.length;i++) {
const el = allEls[i];
const ln = el.localName || el.nodeName.replace(/^.*:/,"");
if (ln === "Trackpoint") trackpoints.push(el);
}
if (trackpoints.length === 0) return {ok:false, error:"Inga trackpoints hittades – är det en TCX-fil?"};

/* Plocka tid + puls ur varje trackpoint */
function childByName(parent, name) {
const kids = parent.getElementsByTagName("*");
for (let i=0;i<kids.length;i++) {
const ln = kids[i].localName || kids[i].nodeName.replace(/^.*:/,"");
if (ln === name) return kids[i];
}
return null;
}

const samples = [];
for (const tp of trackpoints) {
const tEl = childByName(tp, "Time");
const hrEl = childByName(tp, "HeartRateBpm");
if (!tEl || !hrEl) continue;
const vEl = childByName(hrEl, "Value");
if (!vEl) continue;
const ms = Date.parse(tEl.textContent);
const bpm = parseInt(vEl.textContent, 10);
if (isNaN(ms) || isNaN(bpm) || bpm < 25 || bpm > 240) continue;
samples.push([ms, bpm]);
}

if (samples.length === 0) return {ok:false, error:"Filen saknar pulsdata (HeartRateBpm)"};
if (samples.length < 30) return {ok:false, error:`För få pulsvärden (${samples.length}) – filen verkar ofullständig`};

samples.sort((a,b)=>a[0]-b[0]);

/* VALIDERING 2: luckor > 10s */
let maxGap = 0;
for (let i=1;i<samples.length;i++) maxGap = Math.max(maxGap, (samples[i][0]-samples[i-1][0])/1000);
const hasGaps = maxGap > 10;

/* VALIDERING 3: frusen svans – >=4 identiska värden sist betyder att
   sensorn tappade kontakt eller att appen frös värdet. Räknas bort ur HRR. */
let frozenTail = 0;
{
const last = samples[samples.length-1][1];
for (let i=samples.length-1; i>=0; i--) {
if (samples[i][1] === last) frozenTail++; else break;
}
if (frozenTail < 4) frozenTail = 0;
}

const startMs = samples[0][0];
const endMs = samples[samples.length-1][0];
const durationSec = Math.round((endMs-startMs)/1000);
if (durationSec < 60) return {ok:false, error:"Passet är kortare än 1 minut"};

/* Datum + starttid i lokal tid */
const startDate = new Date(startMs);
const pad = n => String(n).padStart(2,"0");
const dateStr = `${startDate.getFullYear()}-${pad(startDate.getMonth()+1)}-${pad(startDate.getDate())}`;
const timeStr = `${pad(startDate.getHours())}:${pad(startDate.getMinutes())}`;

/* Nedsampla till var HR_SAMPLE_SEC:e sekund (medelvärde inom varje fönster) */
const buckets = {};
for (const [ms,bpm] of samples) {
const sec = Math.round((ms-startMs)/1000);
const b = Math.floor(sec/HR_SAMPLE_SEC)*HR_SAMPLE_SEC;
if (!buckets[b]) buckets[b] = [];
buckets[b].push(bpm);
}
const curve = Object.keys(buckets).map(k=>Number(k)).sort((a,b)=>a-b)
.map(sec => [sec, Math.round(buckets[sec].reduce((a,b)=>a+b,0)/buckets[sec].length)]);

const bpms = samples.map(s=>s[1]);
const avgHr = Math.round(bpms.reduce((a,b)=>a+b,0)/bpms.length);
const maxHr = Math.max(...bpms);
const minHr = Math.min(...bpms);

return {ok:true, data:{
date: dateStr,
startTime: timeStr,
durationSec,
avgHr, maxHr, minHr,
curve,
sampleSec: HR_SAMPLE_SEC,
rawPoints: samples.length,
maxGapSec: Math.round(maxGap),
hasGaps,
frozenTailPoints: frozenTail,
frozenTailSec: frozenTail ? Math.round((samples[samples.length-1][0]-samples[samples.length-frozenTail][0])/1000) : 0,
fileName: fileName || "",
importedAt: new Date().toISOString(),
}};
} catch(e) {
return {ok:false, error:"Kunde inte läsa filen: "+(e.message||"okänt fel")};
}
}

/* ── Återhämtningspuls (HRR60) ──
   Ankarpunkten är SISTA toppen före varaktig nedgång – alltid i eller precis
   efter sista setet. Söker aldrig bakåt från sessionens maxpuls: ligger maxen
   i ett tidigare set hamnar topp och avläsning på olika tidpunkter, och fallet
   redovisas som om det skett på en minut fast det tog flera.
   Både toppen och avläsningen ska ligga exakt 60 s isär. */
function calcHRR(hr, win) {
if (!hr || !hr.curve || hr.curve.length < 10) return null;

/* Frusen svans: sensorn tappade kontakt. Exkluderas ur kurvan, och om
   avläsningspunkten hamnar där kan HRR inte beräknas alls. */
let c = hr.curve;
let frozenFrom = null;
if (hr.frozenTailSec && hr.frozenTailSec > 5) {
frozenFrom = c[c.length-1][0] - hr.frozenTailSec;
const trimmed = c.filter(([s])=>s <= frozenFrom);
if (trimmed.length >= 10) c = trimmed;
}
const lastSec = c[c.length-1][0];

/* Sökfönster: slutet av arbetet. Utan arbetsfönster, sista fjärdedelen. */
const back = win && win.iv ? win.iv*1.3 : 150;
const from = win && win.to != null ? Math.max(0, win.to-back) : lastSec*0.75;
const to   = win && win.to != null ? Math.min(lastSec, win.to+90) : lastSec;

const idx = [];
for (let i=1; i<c.length-1; i++) if (c[i][0]>=from && c[i][0]<=to) idx.push(i);
if (!idx.length) return null;
const maxInWin = Math.max(...idx.map(i=>c[i][1]));

/* Varaktig nedgång: pulsen ligger under toppvärdet i minst 30 sammanhängande
   sekunder utan att återvända till nivån. */
function sustained(i) {
const peak = c[i][1], t0 = c[i][0];
for (let j=i+1; j<c.length; j++) {
if (c[j][1] >= peak) return false;
if (c[j][0]-t0 >= 30) return true;
}
return false;
}
/* Lokalt maximum – en punkt på en fallande flank räknas inte som topp. */
const isPeak = i => c[i][1] >= c[i-1][1] && c[i][1] > c[i+1][1];

/* Den SISTA kvalificerade toppen, inte den med störst fall.
   Höjdkravet sållar bort ripplar i nedvarvningen: en upphackning på vägen ned
   är alltid lägre än setets egen topp, och skulle annars kapa ankaret. */
let peakIdx = -1;
for (let k=idx.length-1; k>=0; k--) {
const i = idx[k];
if (c[i][1] < maxInWin-10) continue;
if (!isPeak(i) || !sustained(i)) continue;
peakIdx = i; break;
}
/* Fallback: högsta punkten i fönstret med minst 60 s data efter. */
if (peakIdx === -1) {
for (const i of idx) {
if (c[i][1] !== maxInWin) continue;
if (lastSec - c[i][0] >= 60) { peakIdx = i; break; }
}
}
if (peakIdx === -1) return null;

const [peakSec, peakBpm] = c[peakIdx];
const secsAfter = lastSec - peakSec;

/* Avläsning exakt 60 s efter toppen – aldrig ett minvärde ur ett fönster. */
const target = peakSec + 60;
let at60 = null;
if (frozenFrom == null || target <= frozenFrom) {
let bestDiff = 1e9;
for (const [s,b] of c) {
const d = Math.abs(s-target);
if (d < bestDiff) { bestDiff = d; at60 = b; }
}
if (bestDiff > HR_SAMPLE_SEC) at60 = null;
}
const drop60 = at60 !== null ? peakBpm-at60 : null;

let quality = "ok";
let warning = null;
if (drop60 === null) { quality="unreliable"; warning="Inspelningen slutade innan 60 s efter sista toppen – HRR kan inte läsas av"; }
else if (secsAfter < 90) { quality="limited"; warning="Knappt 90 s data efter sista toppen – låt bandet gå 2–3 min efter passet för säkrare värde"; }
if (hr.frozenTailSec > 5) {
quality = quality==="ok" ? "limited" : quality;
warning = (warning?warning+" · ":"") + `Sista ${hr.frozenTailSec} s var frusna på samma värde och räknades bort`;
}

return {peakBpm, peakSec, drop60, at60, secsAfter, quality, warning};
}

/* ── Pulsdrift: jämför snittpuls första vs sista tredjedelen av arbetet ── */
/* Arbetsfönstret: från första setets start till sista setets slut.
   Utan det räknas uppvärmning och nedvarvning in, vilket gör snitt och
   drift ojämförbara mellan pass beroende på hur länge bandet fick gå. */
function workWindow(hr, intervalSec, numSets, pauses) {
const sd = calcSetHR(hr, intervalSec, numSets, pauses);
if (!sd || !sd.sets.length) return null;
const first = sd.sets[0];
const last = sd.sets[sd.sets.length-1];
return {from: first.startSec, to: last.startSec + sd.intervalSec, iv: sd.intervalSec};
}

/* Kurvan begränsad till arbetsfönstret. Faller tillbaka på hela kurvan
   om set-data saknas. */
function workCurve(hr, win) {
if (!hr || !hr.curve) return [];
if (!win) return hr.curve;
const seg = hr.curve.filter(([s])=>s>=win.from && s<=win.to);
return seg.length >= 10 ? seg : hr.curve;
}

/* Drift = snittpuls andra halvan av arbetsfönstret minus första halvan.
   Halvor, inte tredjedelar: tredjedelar jämför mer extrema ändar och
   överdriver driften (+27 där halvorna ger +18 på samma fil). */
function calcDrift(hr, win) {
const c = workCurve(hr, win);
if (c.length < 12) return null;
const n = c.length;
const half = Math.floor(n/2);
const avg = arr => Math.round(arr.reduce((a,b)=>a+b[1],0)/arr.length);
const first = avg(c.slice(0, half));
const last = avg(c.slice(n-half));
return {first, last, drift: last-first, windowed: !!win};
}

/* Snitt- och maxpuls inom arbetsfönstret */
function calcWorkStats(hr, win) {
const c = workCurve(hr, win);
if (!c.length) return null;
const v = c.map(p=>p[1]);
return {
avg: Math.round(v.reduce((a,b)=>a+b,0)/v.length),
max: Math.max(...v),
min: Math.min(...v),
windowed: !!win,
};
}

/* Set-analys för valfri passtyp – plockar rätt fält automatiskt.
   Giant: intervalSec + giantSets + giantPauses. ABC: secPerSet + sets + pauses. */
function setHRForLog(l) {
if (!l || !l.hr) return null;
const iv = logInterval(l);
if (!iv) return null;
const totalSets = l.type==="Giant" ? Number(l.giantSets||0) : Number(l.sets||0);
if (!totalSets) return null;
/* hrStartSet = vilket set mätningen faktiskt började på (1 = från början).
   Glömd pulsmätare fram till set 4 → hrStartSet = 4. */
const startSet = Math.max(1, Number(l.hrStartSet||1));
const measured = totalSets - startSet + 1;
if (measured < 1) return null;
const pauses = l.type==="Giant"
? (l.giantPauses||[]).map(p=>({...p, afterSet: Number(p.afterSet||0)-startSet+1}))
: (l.pauses||[]).map(p=>({afterSet: totalSets - Number(p.setsLeft||0) - startSet + 1, minutes: p.minutes}));
const sd = calcSetHR(l.hr, iv, measured, pauses.filter(p=>p.afterSet>0));
if (!sd) return null;
/* Numrera om till passets riktiga setnummer */
const shift = startSet - 1;
if (shift > 0) {
sd.sets = sd.sets.map(s=>({...s, set: s.set + shift}));
if (sd.ceilingSet != null) {
sd.ceilingSet = sd.ceilingSet + shift;
sd.ceilingPct = Math.round(100*sd.ceilingSet/totalSets);
}
const s10 = sd.sets.find(s=>s.set===10);
sd.hrAtSet10 = s10 ? s10.avgBpm : null;
sd.partial = true;
sd.startSet = startSet;
sd.totalSets = totalSets;
}
return sd;
}
function workWindowForLog(l) {
const sd = setHRForLog(l);
if (!sd || !sd.sets.length) return null;
const first = sd.sets[0], last = sd.sets[sd.sets.length-1];
return {from: first.startSec, to: last.startSec + sd.intervalSec, iv: sd.intervalSec};
}

/* ── Puls per set utifrån fasta intervall ── */
function calcSetHR(hr, intervalSec, numSets, pauses) {
if (!hr || !hr.curve || !intervalSec || !numSets) return null;
const iv = Number(intervalSec), ns = Number(numSets);
if (!iv || !ns || iv < 10 || ns < 1) return null;
const c = hr.curve;
const lastSec = c[c.length-1][0];

/* Snabb uppslagning: array indexerad per sekund */
const lut = new Int16Array(lastSec+1);
{
let j=0;
for (let s=0; s<=lastSec; s++) {
while (j+1 < c.length && c[j+1][0] <= s) j++;
lut[s] = c[j][1];
}
}
const bpmAt = s => lut[Math.max(0, Math.min(lastSec, Math.round(s)))];

/* Pauser: användaren anger ungefärlig tid. Vi söker den verkliga
   förskjutningen inom ±50% av angivet värde (min ±45s). */
const pauseList = (pauses||[]).filter(p=>p&&p.afterSet&&p.minutes)
.map(p=>{
const nominal = Number(p.minutes)*60;
const slack = Math.max(45, nominal*0.5);
return {after:Number(p.afterSet), nominal, min:Math.max(0,nominal-slack), max:nominal+slack};
})
.sort((a,b)=>a.after-b.after);

/* Poängsätt ett förslag: hög sågtandsamplitud = bra passform */
function scoreLayout(off, pauseSecs) {
let amp=0, n=0;
for (let i=0;i<ns;i++) {
let shift=0;
for (let k=0;k<pauseList.length;k++) if (i+1 > pauseList[k].after) shift += pauseSecs[k];
const s = off + i*iv + shift;
if (s < 0 || s+iv > lastSec) return -1e9;
let peak=-1, lo=1e9;
for (let t=s; t<s+iv; t+=HR_SAMPLE_SEC) {
const v = bpmAt(t);
if (v>peak) peak=v;
if (v<lo) lo=v;
}
amp += (peak - bpmAt(s)); n++;
}
return n ? amp/n : -1e9;
}

const totalNominal = pauseList.reduce((s,p)=>s+p.nominal,0);
if (iv*ns + Math.max(0,totalNominal - pauseList.length*45) > lastSec) return null;

/* Sök bästa kombination av startoffset och paustider */
let best={score:-1e9, off:0, pauseSecs:pauseList.map(p=>p.nominal)};
const STEP = 5;

function search(idx, current) {
if (idx === pauseList.length) {
const used = current.reduce((a,b)=>a+b,0);
const maxOff = Math.max(0, Math.floor(lastSec - (iv*ns + used)));
for (let off=0; off<=maxOff; off+=1) {
const sc = scoreLayout(off, current);
if (sc > best.score) best = {score:sc, off, pauseSecs:[...current]};
}
return;
}
const p = pauseList[idx];
for (let v=p.min; v<=p.max; v+=STEP) {
current.push(v); search(idx+1, current); current.pop();
}
}
search(0, []);

if (best.score <= -1e9) return null;

/* Bygg setlistan med den bästa passformen */
const shiftFor = i => {
let s=0;
for (let k=0;k<pauseList.length;k++) if (i+1 > pauseList[k].after) s += best.pauseSecs[k];
return s;
};
const sets = [];
for (let i=0;i<ns;i++) {
const s = best.off + i*iv + shiftFor(i);
const vals=[];
for (let t=s; t<s+iv; t+=HR_SAMPLE_SEC) vals.push(bpmAt(t));
if (!vals.length) continue;
sets.push({
set: i+1,
startSec: Math.round(s),
startBpm: bpmAt(s),
maxBpm: Math.max(...vals),
minBpm: Math.min(...vals),
avgBpm: Math.round(vals.reduce((a,b)=>a+b,0)/vals.length),
});
}

/* ── PLATÅ-DETEKTION ──
   Första set vars topp-puls ligger inom 5 bpm från passets högsta set-topp,
   OCH där ingen efterföljande sets topp faller mer än 5 bpm under den nivån.
   Enstaka set som når högt tidigt men följs av lägre set räknas inte.
   Platånivån är inte maxpuls – den är dagtypsspecifik. */
const PLATEAU_TOL = 5;
const mx = sets.map(s=>s.maxBpm);
const sessionMax = mx.length ? Math.max(...mx) : 0;
let ceilingSet = null, ceilingBpm = null, ceilingPct = null;
if (mx.length >= 4) {
const reachLevel = sessionMax - PLATEAU_TOL;
for (let i=0; i<mx.length; i++) {
if (mx[i] < reachLevel) continue;
/* Håller nivån resten av passet? */
let holds = true;
for (let j=i+1; j<mx.length; j++) {
if (mx[j] < mx[i] - PLATEAU_TOL) { holds = false; break; }
}
if (holds) {
ceilingSet = sets[i].set;
ceilingBpm = mx[i];
ceilingPct = Math.round(100*ceilingSet/sets.length);
break;
}
}
}

const set10 = sets.find(s=>s.set===10);
return {
hrAtSet10: set10 ? set10.avgBpm : null,
offset: best.off,
intervalSec: iv,
pauseSecs: best.pauseSecs,
pauseInfo: pauseList.map((p,i)=>({afterSet:p.after, nominalMin:Math.round(p.nominal/60), actualMin:Math.round(best.pauseSecs[i]/60*10)/10})),
sets, sessionMax, ceilingBpm, ceilingSet, ceilingPct,
};
}

const emptyForm = {
date:todayStr(),startTime:"",type:"Press",steges:[emptyStege()],pressSets:"",pressReps:"3",pressKg:"24",pp1:"",pp2:"",pp3:"",pressRestSec:"90",carry:[{L:"",R:""},{L:"",R:""}],carryMode:"match",pressNote:"",
sets:"",secPerSet:"",abcKg:"24",bonusSets:"",pauses:[],
otherTitle:"",otherNotes:"",
wwKg:"16",wwRounds:[[]],wwNotes:"",
giantDay:"1",giantSets:"",giantKg:"24",intervalSec:"",intervalRaw:"",giantIncomplete:"",giantPauses:[],
feeling:2,sleep:3,stress:3,
bodyLog:"",notes:"",
};

/* Giant: reps per dag-typ */
const GIANT_REPS = {"1":1,"2":2,"3":3};

/* Textetiketter för sömn och stress – tydligare än stjärnor/trianglar */
const SLEEP_LABELS = ["", "Uselt · ~4h", "Dåligt · ~5h", "Ok · ~6h", "God · ~7h", "Bra · 8h+"];
const STRESS_LABELS = ["", "Låg", "Ganska låg", "Medel", "Hög", "Mycket hög"];
const sleepLabel = v => SLEEP_LABELS[v||3] || "Ok · ~6h";
const stressLabel = v => STRESS_LABELS[v||3] || "Medel";

/* Beräknad passlängd: från pulsdata om den finns, annars intervall x set */
/* ══ GIANT: reps inom 30 min – normaliserar bort valt intervall ══ */
const GIANT_CAP_SEC = 1800;
/* Minsta arbetstid för att ett pass ska räknas i trendlinjen.
   28 min ger luft för avrundning (17 set à 1:45 = 29:45 räknas),
   men utesluter pass som stannade långt före containern. */
const MIN_FILL_SEC = 1680;
/* Fyllde passet containern? Gäller ABC och Giant – används både i
   densitetstrenden och pulstrenden så samma pass räknas överallt. */
function passFilled(l) {
if (l.type==="ABC") { const d=abcDensity(l); return d?d.filled:true; }
if (l.type==="Giant") { const d=giantDensity(l); return d?d.filled:true; }
return true;
}

/* Intervall visas som 1:18 istället för 78s – samma format som timerappen */
function fmtInterval(sec) {
const s = Math.round(Number(sec)||0);
if (!s) return "";
return s < 60 ? `${s}s` : `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}
/* Tolkar både "78" och "1:18" till sekunder */
function parseInterval(str) {
if (str === null || str === undefined) return "";
const t = String(str).trim();
if (!t) return "";
if (t.includes(":")) {
const [m,s] = t.split(":");
const mm = parseInt(m,10)||0, ss = parseInt(s,10)||0;
return mm*60+ss;
}
const n = parseFloat(t.replace(",","."));
return isNaN(n) ? "" : n;
}
/* Passets intervall i sekunder – Giant och ABC lagrar i olika fält */
function logInterval(l) {
if (l.intervalSec) return Number(l.intervalSec);
if (l.secPerSet) return Number(l.secPerSet);
return 0;
}
/* Extrapaus i sekunder totalt – olika format per passtyp */
function logPauseSec(l) {
if (l.type==="Giant") return (l.giantPauses||[]).reduce((s,p)=>s+Number(p.minutes||0)*60,0);
return (l.pauses||[]).reduce((s,p)=>s+Number(p.minutes||0)*60,0);
}

/* ── ABC-densitet: kompletta set inom 30 min ──
   Måttet ÄR målet: 30 set på 30 min = december. */
function abcDensity(l) {
if (l.type !== "ABC") return null;
const iv = logInterval(l);
const sets = Number(l.sets||0);
if (!iv || !sets) return null;
const pauseSec = logPauseSec(l);
const capacity = Math.floor(Math.max(0, GIANT_CAP_SEC - pauseSec) / iv);
const setsIn30 = Math.min(capacity, sets);
const workSec = setsIn30*iv + pauseSec;
return {
intervalSec: iv, capacity, setsIn30,
setsTotal: sets,
setsOver30: Math.max(0, sets - capacity),
pauseSec, workSec,
workMin: Math.round(workSec/60),
filled: workSec >= MIN_FILL_SEC,
goalPct: Math.round(100*setsIn30/30),
};
}

function giantDensity(l) {
if (l.type !== "Giant") return null;
const iv = logInterval(l);
const total = Number(l.giantSets||0);
if (!iv || !total) return null;
const reps = GIANT_REPS[l.giantDay]||1;
const incomplete = Number(l.giantIncomplete||0);
const complete = Math.max(0, total - incomplete);
/* Hur många set ryms i behållaren? Extrapaus äter av tiden. */
const pauseSec = (l.giantPauses||[]).reduce((s,p)=>s+Number(p.minutes||0)*60,0);
const capacity = Math.floor(Math.max(0, GIANT_CAP_SEC - pauseSec) / iv);
const setsIn30 = Math.min(capacity, complete);
const reps30 = setsIn30 * reps;
/* Fullständigt pass = fyllde behållaren med kompletta set */
const workSec = setsIn30*iv + pauseSec;
const filled = workSec >= MIN_FILL_SEC;
return {
intervalSec: iv, repsPerSet: reps,
setsTotal: total, setsIncomplete: incomplete, setsComplete: complete,
capacity, setsIn30, reps30,
setsOver30: Math.max(0, complete - capacity),
workSec, workMin: Math.round(workSec/60),
filled,
};
}

function passMinutes(l) {
if (l.hr && l.hr.durationSec) return Math.round(l.hr.durationSec/60);
const sets = Number(l.giantSets||l.sets||0);
const iv = Number(l.intervalSec||0);
const pause = (l.giantPauses||[]).reduce((s,p)=>s+Number(p.minutes||0),0);
if (sets && iv) return Math.round((sets*iv)/60 + pause);
return null;
}

function pressPPTotal(l) {
const ps=Number(l.pressSets||0), pr=Number(l.pressReps||0);
const a=Number(l.pp1||0), b=Number(l.pp2||0), d=Number(l.pp3||0);
let t=0;
for (let s=1;s<=ps;s++) {
let n=0;
if (a&&s>=a) n=1;
if (b&&s>=b) n=2;
if (d&&s>=d) n=3;
t+=Math.min(n,pr);
}
return t;
}
function carryGapPct(l) {
const cs=(l.carry||[]).filter(x=>x&&x.L&&x.R);
if (!cs.length) return null;
const ps=cs.map(x=>Math.round(100*Math.abs(Number(x.L)-Number(x.R))/Math.max(Number(x.L),Number(x.R))));
return Math.round(ps.reduce((s,x)=>s+x,0)/ps.length);
}

function totalPP(log) {
if (!log.steges) return 0;
return log.steges.reduce((sum,s)=>
sum+(s.two?.pp||0)+(s.three?.pp||0)+(s.five?.pp||0)+((s.showTen&&s.ten?.pp)||0),0);
}

/* Antal rena/gjorda reps (exkl. 10-stegen om den inte lagts till) */
function stegeIsDone(s) {
return (s.two?.done||false)||(s.three?.done||false)||(s.five?.done||false)||(s.showTen&&(s.ten?.done||false));
}

const [localPP, setLocalPP] = us(pp||0);
const timerRef = ur(null);
const LOCK_DELAY = 3000; /* 3 sekunder inaktivitet → låser cellen */

/* Synka utifrån om cellen redigeras externt (t.ex. vid edit av gammalt pass) */
ue(()=>{ setLocalDone(done||false); },[done]);
ue(()=>{ setLocalPP(pp||0); },[pp]);

function resetTimer() {
clearTimeout(timerRef.current);
timerRef.current = setTimeout(()=>{
/* Lås cellen efter inaktivitet – anropa parent med aktuell state */
onDone(true, localPP);
setLocalDone(true);
}, LOCK_DELAY);
}

function handleDone() {
setLocalDone(true);
onDone(true, localPP);
clearTimeout(timerRef.current);
}

function handleUndo() {
setLocalDone(false);
setLocalPP(0);
onDone(false, 0);
clearTimeout(timerRef.current);
}

function handlePP(newPP) {
const clamped = Math.max(0, Math.min(maxReps, newPP));
setLocalPP(clamped);

if (!localDone) resetTimer();

function TimerView() {
const [sets, setSets] = useState("20");
const [secPerSet, setSecPerSet] = useState("90");
const [phase, setPhase] = useState("idle");
const [currentSet, setCurrentSet] = useState(0);
const [timeLeft, setTimeLeft] = useState(0);
const [pauseLog, setPauseLog] = useState([]);
const [totalPauseSeconds, setTotalPauseSeconds] = useState(0);

const setEndRef = useRef(null);
const pauseStartRef = useRef(null);
const tickRef = useRef(null);
const audioCtxRef = useRef(null);

const totalSets = parseInt(sets) || 0;
const sPerSet = parseInt(secPerSet) || 90;

function getAudio() {
if (!audioCtxRef.current)
audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
return audioCtxRef.current;
}

function beep(freq, dur, vol=0.4, delay=0) {
try {
const ctx = getAudio();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.connect(gain); gain.connect(ctx.destination);
osc.frequency.value = freq; osc.type = "sine";
const t = ctx.currentTime + delay;
gain.gain.setValueAtTime(vol, t);
gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
osc.start(t); osc.stop(t + dur);
} catch(e) {}
}

function beepNewSet()  { beep(880, 0.15, 0.5); }
function beepCount()   { beep(660, 0.08, 0.2); }
function beepDone()    { beep(1046,0.15,0.5); beep(1318,0.15,0.5,0.2); beep(1568,0.25,0.5,0.4); }

function startTick(endTime) {
clearInterval(tickRef.current);
tickRef.current = setInterval(() => {
const left = Math.max(0, Math.round((endTime - Date.now()) / 1000));
setTimeLeft(left);
if (left === 3 || left === 2 || left === 1) beepCount();
if (left === 0) {
clearInterval(tickRef.current);
setCurrentSet(cs => {
const next = cs + 1;
if (next > totalSets) {
setPhase("done");
beepDone();
return cs;
}
beepNewSet();
const newEnd = Date.now() + sPerSet * 1000;
setEndRef.current = newEnd;
setTimeLeft(sPerSet);
startTick(newEnd);
return next;
});
}
}, 500);
}

function start() {
getAudio();
const endTime = Date.now() + sPerSet * 1000;
setEndRef.current = endTime;
setPhase("running");
setCurrentSet(1);
setTimeLeft(sPerSet);
setPauseLog([]);
setTotalPauseSeconds(0);
beepNewSet();
startTick(endTime);
}

function pause() {
clearInterval(tickRef.current);
pauseStartRef.current = Date.now();
setPhase("paused");
}

function resume() {
const pausedFor = Math.round((Date.now() - pauseStartRef.current) / 1000);
setTotalPauseSeconds(p => p + pausedFor);
setPauseLog(pl => {
const entry = {set: currentSet, seconds: pausedFor};
return [...pl, entry];
});
const newEnd = setEndRef.current + (Date.now() - pauseStartRef.current);
setEndRef.current = newEnd;
setPhase("running");
startTick(newEnd);
}

function stop() {
clearInterval(tickRef.current);
setPhase("idle");
setCurrentSet(0);
setTimeLeft(0);
setPauseLog([]);
setTotalPauseSeconds(0);
}

useEffect(() => () => clearInterval(tickRef.current), []);

const pct = phase === "running" ? ((sPerSet - timeLeft) / sPerSet) * 100 : 0;
const radius = 80;
const circ = 2 * Math.PI * radius;
const strokeDash = circ - (pct / 100) * circ;
const isLast3 = phase === "running" && timeLeft <= 3 && timeLeft > 0;
const cardStyle = {background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:"18px 20px",marginBottom:14,boxShadow:`0 1px 3px ${C.shadow}`};

function fmtSec(s) { return s < 60 ? `${s} sek` : `${Math.floor(s/60)} min ${s%60} sek`; }

return (
<div style={{display:"flex",flexDirection:"column",gap:14}}>
{phase === "idle" && (
<div style={cardStyle}>
<div style={labelStyle}>Timer</div>
<div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap"}}>
<div style={{flex:1,minWidth:100}}>
<label style={{display:"block",fontSize:"0.65rem",color:C.muted,marginBottom:6,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase"}}>Antal set</label>
<input type="number" value={sets} onChange={e=>setSets(e.target.value)} style={{...IS,fontSize:"16px",width:"100%"}}/>
</div>
<div style={{flex:1,minWidth:100}}>
<label style={{display:"block",fontSize:"0.65rem",color:C.muted,marginBottom:6,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase"}}>Sek / set</label>
<input type="number" value={secPerSet} onChange={e=>setSecPerSet(e.target.value)} style={{...IS,fontSize:"16px",width:"100%"}}/>
</div>
</div>
<div style={{marginTop:10,fontSize:"0.65rem",color:C.faint}}>
Total tid: {Math.floor(totalSets * sPerSet / 60)} min {(totalSets * sPerSet) % 60} sek
</div>
</div>
)}

<div style={{...cardStyle,textAlign:"center",padding:"28px 20px"}}>
{phase === "done" ? (
<div>
<div style={{fontSize:"3rem",marginBottom:8}}>🎯</div>
<div style={{fontFamily:"'Syne',sans-serif",fontSize:"1.4rem",fontWeight:800,color:C.accent,marginBottom:6}}>Klart!</div>
<div style={{fontSize:"0.8rem",color:C.muted,marginBottom:4}}>{totalSets} set · {sPerSet} sek/set</div>
{pauseLog.length > 0 && (
<div style={{marginTop:10,background:C.bg,borderRadius:8,padding:"10px 14px",textAlign:"left"}}>
<div style={{fontSize:"0.6rem",letterSpacing:"0.1em",textTransform:"uppercase",color:C.faint,marginBottom:6,fontWeight:600}}>Pauser</div>
{pauseLog.map((p,i)=>(
<div key={i} style={{fontSize:"0.68rem",color:C.muted,marginBottom:3}}>Set {p.set}: {fmtSec(p.seconds)}</div>
))}
<div style={{fontSize:"0.7rem",color:C.orange,marginTop:6,fontWeight:600}}>Totalt pausat: {fmtSec(totalPauseSeconds)}</div>
</div>
)}
</div>
) : (phase === "running" || phase === "paused") ? (
<div>
<div style={{fontSize:"0.65rem",letterSpacing:"0.12em",textTransform:"uppercase",color:C.faint,marginBottom:12,fontWeight:600}}>
Set {currentSet} av {totalSets}
{phase === "paused" && <span style={{color:C.orange,marginLeft:8}}>· Pausad</span>}
</div>
<div style={{position:"relative",display:"inline-block",marginBottom:16}}>
<svg width={200} height={200} style={{transform:"rotate(-90deg)"}}>
<circle cx={100} cy={100} r={radius} fill="none" stroke={C.border} strokeWidth={10}/>
<circle cx={100} cy={100} r={radius} fill="none"
stroke={phase==="paused"?C.orange:isLast3?C.orange:C.accent}
strokeWidth={10}
strokeDasharray={circ}
strokeDashoffset={strokeDash}
strokeLinecap="round"
style={{transition:"stroke-dashoffset 0.45s linear,stroke 0.3s"}}/>
</svg>
<div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",textAlign:"center"}}>
<div style={{fontFamily:"'Syne',sans-serif",fontSize:"2.8rem",fontWeight:800,
color:phase==="paused"?C.orange:isLast3?C.orange:C.text,lineHeight:1,transition:"color 0.3s"}}>
{phase==="paused"?"⏸":timeLeft}
</div>
<div style={{fontSize:"0.6rem",color:C.faint,letterSpacing:"0.1em"}}>
{phase==="paused"?"pausad":"sekunder"}
</div>
</div>
</div>
<div style={{display:"flex",justifyContent:"center",flexWrap:"wrap",gap:5,maxWidth:300,margin:"0 auto 16px"}}>
{Array.from({length:totalSets}).map((_,i)=>(
<div key={i} style={{
width:10,height:10,borderRadius:"50%",
background:i<currentSet-1?C.accent:i===currentSet-1?C.accentMid:C.border,
transition:"background 0.3s",
}}/>
))}
</div>
{pauseLog.length > 0 && (
<div style={{fontSize:"0.62rem",color:C.orange,marginBottom:8}}>
{pauseLog.length} paus{pauseLog.length>1?"er":""} · {fmtSec(totalPauseSeconds)} totalt
</div>
)}
</div>
) : (
<div>
<div style={{fontFamily:"'Syne',sans-serif",fontSize:"1.1rem",fontWeight:800,color:C.text,marginBottom:4}}>
{totalSets} set · {sPerSet} sek
</div>
<div style={{fontSize:"0.7rem",color:C.faint}}>Tryck Start för att börja</div>
</div>
)}
</div>

<div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
{phase === "idle" && (
<button onClick={start} style={{background:C.accent,border:"none",color:"#fff",padding:"14px 40px",borderRadius:10,cursor:"pointer",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"1rem",touchAction:"manipulation"}}>
Start
</button>
)}
{phase === "running" && (
<>
<button onClick={pause} style={{background:C.orangeBg,border:`2px solid ${C.orangeBorder}`,color:C.orange,padding:"12px 28px",borderRadius:10,cursor:"pointer",fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"0.9rem",touchAction:"manipulation"}}>
Pausa
</button>
<button onClick={stop} style={{background:C.surface,border:`2px solid ${C.border2}`,color:C.muted,padding:"12px 24px",borderRadius:10,cursor:"pointer",fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"0.9rem",touchAction:"manipulation"}}>
Avbryt
</button>
</>
)}
{phase === "paused" && (
<>
<button onClick={resume} style={{background:C.accent,border:"none",color:"#fff",padding:"14px 32px",borderRadius:10,cursor:"pointer",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"1rem",touchAction:"manipulation"}}>
Fortsätt
</button>
<button onClick={stop} style={{background:C.surface,border:`2px solid ${C.border2}`,color:C.muted,padding:"12px 24px",borderRadius:10,cursor:"pointer",fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"0.9rem",touchAction:"manipulation"}}>
Avbryt
</button>
</>
)}
{phase === "done" && (
<button onClick={stop} style={{background:C.accent,border:"none",color:"#fff",padding:"14px 40px",borderRadius:10,cursor:"pointer",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"1rem",touchAction:"manipulation"}}>
Ny timer
</button>
)}
</div>
</div>
);
}

const [tcxResults,setTcxResults]=useState([]);
const [tcxBusy,setTcxBusy]=useState(false);

async function handleTCXFiles(fileList) {
const files=Array.from(fileList||[]);
if(files.length===0) return;
setTcxBusy(true);
setTcxResults([]);
const results=[];
for (const f of files) {
try {
const nm=(f.name||"").toLowerCase();
if (nm && !nm.endsWith(".tcx") && !nm.endsWith(".xml")) {
results.push({file:f.name, ok:false, msg:"Inte en TCX-fil – exportera från flow.polar.com"});
continue;
}
const text=await f.text();
const parsed=parseTCX(text, f.name);
if(!parsed.ok) { results.push({file:f.name, ok:false, msg:parsed.error}); continue; }
const hr=parsed.data;
const match=logs.find(l=>l.date===hr.date);
if(!match) { results.push({file:f.name, ok:false, msg:`Inget loggat pass ${hr.date} – logga passet först`}); continue; }
if(match.hr) { results.push({file:f.name, ok:false, msg:`Pass ${hr.date} har redan pulsdata`}); continue; }
await onSaveHR(match.id, hr);
results.push({file:f.name, ok:true, logId:match.id, date:hr.date,
msg:`${hr.date} · ${Math.round(hr.durationSec/60)} min · snitt ${hr.avgHr} max ${hr.maxHr}`});
} catch(e) {
results.push({file:f.name, ok:false, msg:"Fel: "+(e.message||"okänt")});
}
}
setTcxResults(results);
setTcxBusy(false);
}
const [copied,setCopied]=useState(false);
const [showBackup,setShowBackup]=useState(false);
const [localGoals,setLocalGoals]=useState(goals);

async function handleSaveGoals() {
await onSaveGoals(localGoals);
setGoalsSaved(true);
setTimeout(()=>setGoalsSaved(false),2000);
}

function handleCopy() {
navigator.clipboard.writeText(backupText).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);}).catch(()=>{
const el=document.getElementById("backup-ta");
if(el){el.select();document.execCommand("copy");}
setCopied(true);setTimeout(()=>setCopied(false),2500);
});
}
async function handleImport() {
try {
const data=JSON.parse(importText.trim());
if(!data.logs) throw new Error("Ogiltig data");
await onImport(data);
setImportStatus(`✓ Återställt! ${data.logs.length} pass inlästa.`);
setImportText("");

/* Helper: format a single rep-cell summary with weight always visible */
function repSummary(d, reps) {
if (!d) return null;
const pp = d.pp || 0;
const split = d.split || "";
const clean = reps - pp;
if (split) return `${split}`;
if (pp === 0) return `${reps}×${d.kg}✓`;
return `${clean}✓+${pp}PP×${d.kg}`;
}

/* ── Pulskurva för ett pass ── */
function HRChart({hr, setData}) {
if (!hr || !hr.curve || hr.curve.length < 2) return null;
const c = hr.curve;
const W = 320, H = 120, PADL = 26, PADB = 16, PADT = 8;
const maxSec = c[c.length-1][0];
const hiRaw = Math.max(...c.map(p=>p[1]));
const loRaw = Math.min(...c.map(p=>p[1]));
const hi = Math.ceil((hiRaw+5)/10)*10;
const lo = Math.floor((loRaw-5)/10)*10;
const span = Math.max(1, hi-lo);
const x = sec => PADL + (sec/maxSec)*(W-PADL-4);
const y = bpm => PADT + (1-(bpm-lo)/span)*(H-PADT-PADB);
const path = c.map((p,i)=>`${i===0?"M":"L"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
const area = path+` L${x(maxSec).toFixed(1)},${(H-PADB).toFixed(1)} L${PADL},${(H-PADB).toFixed(1)} Z`;
const ticks = [lo, Math.round((lo+hi)/2), hi];
const mm = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
return (
<div style={{marginTop:10}}>
<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
<defs>
<linearGradient id="hrgrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stopColor="#C4564C" stopOpacity="0.28"/>
<stop offset="100%" stopColor="#C4564C" stopOpacity="0.02"/>
</linearGradient>
</defs>
{ticks.map(t=>(
<g key={t}>
<line x1={PADL} y1={y(t)} x2={W-4} y2={y(t)} stroke={C.border} strokeWidth="0.5" strokeDasharray="2 3"/>
<text x={PADL-4} y={y(t)+3} textAnchor="end" fontSize="7" fill={C.faint}>{t}</text>
</g>
))}
{setData&&setData.sets&&setData.sets.map(s=>(
<line key={s.set} x1={x(s.startSec)} y1={PADT} x2={x(s.startSec)} y2={H-PADB}
stroke="#4A1A78" strokeWidth="0.4" opacity="0.25"/>
))}
<path d={area} fill="url(#hrgrad)"/>
<path d={path} fill="none" stroke="#C4564C" strokeWidth="1.2" strokeLinejoin="round"/>
{[0, Math.round(maxSec/2), maxSec].map(s=>(
<text key={s} x={x(s)} y={H-4} textAnchor="middle" fontSize="7" fill={C.faint}>{mm(s)}</text>
))}
</svg>
</div>
);
}

function HabitsView({habits, onToggle, isDesktop}) {
const DAYS = 28;
const today = new Date();
const pad = n => String(n).padStart(2,"0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const days = [];
for (let i=0;i<DAYS;i++) {
const d = new Date(today);
d.setDate(today.getDate()-i);
days.push(dstr(d));
}
const WD = ["sön","mån","tis","ons","tor","fre","lör"];
const MO = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const fmt = ds => {
const d = new Date(ds+"T12:00:00");
return {wd:WD[d.getDay()], day:d.getDate(), mon:MO[d.getMonth()]};
};
const on = (ds,hid) => !!(habits[ds]&&habits[ds][hid]);

/* Antal senaste 7 respektive 28 dagarna */
const count = (hid,n) => days.slice(0,n).filter(ds=>on(ds,hid)).length;
/* Dagar sedan senast */
const daysSince = hid => {
for (let i=0;i<days.length;i++) if (on(days[i],hid)) return i;
return null;
};

const cell = 40;
return (
<div style={{display:"flex",flexDirection:"column",gap:14,maxWidth:isDesktop?720:"100%"}}>

<div style={{display:"grid",gridTemplateColumns:`repeat(${HABITS.length},1fr)`,gap:10}}>
{HABITS.map(h=>{
const c7 = count(h.id,7), c28 = count(h.id,28), since = daysSince(h.id);
const stale = since===null || since>=4;
return (
<div key={h.id} style={{background:C.surface,border:`1px solid ${stale?"#e8b8b8":C.border}`,borderRadius:10,padding:"12px 12px",textAlign:"center",boxShadow:`0 1px 3px ${C.shadow}`}}>
<div style={{fontSize:"1.1rem",lineHeight:1.2}}>{h.icon}</div>
<div style={{fontSize:"0.58rem",color:C.muted,letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600,margin:"3px 0 6px"}}>{h.short}</div>
<div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"1.3rem",color:stale?"#a05050":C.accent}}>{c7}<span style={{fontSize:"0.7rem",color:C.faint,fontWeight:500}}>/7</span></div>
<div style={{fontSize:"0.55rem",color:C.faint,marginTop:2}}>{c28} på 28 dgr</div>
<div style={{fontSize:"0.55rem",color:stale?"#a05050":C.faint,marginTop:3,fontWeight:stale?700:400}}>
{since===null?"aldrig":since===0?"idag ✓":`${since} dgr sedan`}
</div>
</div>
);
})}
</div>

<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"6px 10px 10px",boxShadow:`0 1px 3px ${C.shadow}`}}>
<div style={{display:"grid",gridTemplateColumns:`72px repeat(${HABITS.length},1fr)`,alignItems:"center",padding:"8px 2px 8px",borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,background:C.surface,zIndex:2}}>
<div/>
{HABITS.map(h=>(
<div key={h.id} style={{textAlign:"center",fontSize:"0.55rem",color:C.muted,letterSpacing:"0.06em",textTransform:"uppercase",fontWeight:600}}>
<div style={{fontSize:"0.9rem"}}>{h.icon}</div>{h.short}
</div>
))}
</div>
{days.map((ds,di)=>{
const f = fmt(ds);
const isToday = di===0;
const weekend = ["lör","sön"].includes(f.wd);
return (
<div key={ds} style={{
display:"grid",gridTemplateColumns:`72px repeat(${HABITS.length},1fr)`,alignItems:"center",
padding:"2px 2px",borderBottom:di<days.length-1?`1px solid ${C.bg}`:"none",
background:isToday?C.accentLight:"transparent",borderRadius:isToday?6:0,
}}>
<div style={{fontSize:"0.62rem",color:isToday?C.accent:weekend?C.faint:C.muted,fontWeight:isToday?700:500,fontFamily:"'DM Mono',monospace",padding:"6px 0 6px 6px"}}>
{f.wd} {f.day} {f.mon}
</div>
{HABITS.map(h=>{
const active = on(ds,h.id);
return (
<div key={h.id} style={{display:"flex",justifyContent:"center",padding:"3px 0"}}>
<button onClick={()=>onToggle(ds,h.id)} aria-label={`${h.label} ${ds}`} style={{
width:cell-10,height:cell-14,borderRadius:7,cursor:"pointer",touchAction:"manipulation",
background:active?C.accent:"transparent",
border:`2px solid ${active?C.accent:C.border2}`,
color:"#fff",fontSize:"0.8rem",lineHeight:1,padding:0,
display:"flex",alignItems:"center",justifyContent:"center",
transition:"background 0.12s",
}}>{active?"✓":""}</button>
</div>
);
})}
</div>
);
})}
</div>

<div style={{fontSize:"0.6rem",color:C.faint,lineHeight:1.8,padding:"0 4px"}}>
Tryck för att bocka av. Kortet blir rött om det gått fyra dagar eller mer.
Handled: rice bucket + excentriskt, 3–5 ggr/vecka vid skrivbordet. Höft/glute: glutebrygga 2×12 + höftböjarstretch 30–40 s per sida. Bakåtutfallen loggas i passet.
</div>

</div>
);
}

const v = Math.max(1, Number(startSet)||1);
const updated = {...target, hrStartSet: v>1 ? v : undefined};

await dbSaveLog(updated);
setLogs(prev=>prev.map(l=>String(l.id)===String(logId)?updated:l));
}

}

const newIdx = passIndex + 1;
setPassIndex(newIdx);
try {
await Promise.all([
dbSaveState("pass-index", String(newIdx)),
dbSaveState("pass-outcomes", JSON.stringify(newOutcomes)),
]);
} catch(e) { console.error(e); }
}

async function undoAdvance() {
if (passIndex === 0) return;
const newIdx = passIndex - 1;
const newOutcomes = {...passOutcomes};
delete newOutcomes[newIdx];
setPassIndex(newIdx);
setPassOutcomes(newOutcomes);
try {
await Promise.all([
dbSaveState("pass-index", String(newIdx)),
dbSaveState("pass-outcomes", JSON.stringify(newOutcomes)),
]);
} catch(e) { console.error(e); }
}

{(()=>{

)}
{done.length>1&&<path d={line} fill="none" stroke="#7A3A9A" strokeWidth={FS.stroke} strokeLinejoin="round" strokeLinecap="round"/>}
{rows.map((r,i)=>r.d.filled?(
<g key={i}>
<circle cx={x(i)} cy={y(r.d.setsIn30)} r={FS.dot} fill={C.surface} stroke="#7A3A9A" strokeWidth={FS.stroke}/>
<text x={x(i)} y={y(r.d.setsIn30)-FS.dot-6} textAnchor="middle" fontSize={FS.val} fill="#7A3A9A"

</g>
):(
<g key={i}>
<line x1={x(i)-FS.crossArm} y1={y(r.d.setsIn30)-FS.crossArm} x2={x(i)+FS.crossArm} y2={y(r.d.setsIn30)+FS.crossArm} stroke={C.orange} strokeWidth={FS.stroke} strokeLinecap="round"/>
<line x1={x(i)+FS.crossArm} y1={y(r.d.setsIn30)-FS.crossArm} x2={x(i)-FS.crossArm} y2={y(r.d.setsIn30)+FS.crossArm} stroke={C.orange} strokeWidth={FS.stroke} strokeLinecap="round"/>
<text x={x(i)} y={y(r.d.setsIn30)-FS.crossArm-6} textAnchor="middle" fontSize={FS.cross} fill={C.orange}
fontFamily="'Syne',sans-serif" fontWeight="700">{r.d.setsIn30}</text>
</g>
))}
{(()=>{
const perLabel = isDesktop ? 78 : 118;
const maxLabels = Math.max(2, Math.floor((W-PADL-PADR)/perLabel));
const step = n<=maxLabels ? 1 : Math.ceil(n/maxLabels);
const show = i => n<=2 || i===0 || i===n-1 || (i%step===0 && i<n-Math.ceil(step*0.6));
return rows.map((r,i)=>show(i)?(
<text key={i} x={x(i)} y={H-FS.padB*0.28}
textAnchor={n>1&&i===0?"start":n>1&&i===n-1?"end":"middle"}

):null);
})()}
</svg>
);
})()}
<div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${C.border}`,display:"grid",gridTemplateColumns:isDesktop?"repeat(auto-fit,minmax(330px,1fr))":"1fr",gap:"4px 24px"}}>
{rows.map((r,i)=>(
<div key={i} style={{fontSize:"0.62rem",color:C.muted,fontFamily:"'DM Mono',monospace",lineHeight:1.8,display:"flex",gap:6,alignItems:"baseline"}}>
<span style={{color:r.d.filled?"#7A3A9A":C.orange,fontWeight:700,minWidth:8}}>{r.d.filled?"·":"✕"}</span>

<span><strong style={{color:r.d.filled?"#4A1A78":C.orange,fontSize:"0.7rem"}}>{r.d.setsIn30}/{r.d.capacity}</strong>

</div>
))}
</div>
</div>
);
})}
</>

{(()=>{
const hrAll = allLogsSorted.filter(l=>l.hr && l.hr.avgHr);
const hrLogs = hrAll.filter(passFilled);
const hrSkipped = hrAll.length - hrLogs.length;
if (hrLogs.length < 1) return null;

/* Gruppera per passtyp. Dagtyper blandas aldrig – de är olika pass. */
const groupOf = l => l.type==="Giant"
? `giant${l.giantDay||"?"}`
: l.type==="ABC"
? `abc${l.abcKg||"24"}`
: (l.type||"annat").toLowerCase();
const groupLabel = g => g.startsWith("giant")
? `Giant D${g.slice(5)}`
: g.startsWith("abc")
? `ABC ${g.slice(3)} kg`
: g.charAt(0).toUpperCase()+g.slice(1);

const groups = {};
hrLogs.forEach(l=>{ const g=groupOf(l); (groups[g]=groups[g]||[]).push(l); });
const keys = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length || a.localeCompare(b));
const active = keys.includes(hrGroup) ? hrGroup : keys[0];
const sel = groups[active]||[];

const rows = sel.map(l=>{
const sd = setHRForLog(l);
const win = workWindowForLog(l);
const hrr = calcHRR(l.hr, win);
const ws = calcWorkStats(l.hr, win);
const dr = calcDrift(l.hr, win);
return {
label: shortDate(l.date),
avg: ws ? ws.avg : l.hr.avgHr,
hrrAny: hrr && hrr.drop60!==null ? hrr.drop60 : null,
drift: dr ? dr.drift : null,
ceilPct: sd && sd.ceilingPct!=null ? sd.ceilingPct : null,
lastStart: sd && sd.sets.length ? sd.sets[sd.sets.length-1].startBpm : null,

});

{keys.map(g=>(

Dagtyper jämförs aldrig med varandra – belastningen är olika, så måtten är inte jämförbara mellan dem.

{hrSkipped>0&&<div style={{marginTop:5,paddingTop:5,borderTop:"1px solid #E8C4BC"}}>

Eftersom du ökar belastningen varje pass förbättras inget mått automatiskt – du jobbar alltid mot din gräns, och även set 10 kommer tidigare när intervallet kortas. Jämför därför bara pass med <strong>samma intervall</strong>. Vill du ha ett rent svar: upprepa ett tidigare pass exakt.

{(()=>{

<div style={{fontSize:"0.6rem",color:C.muted,lineHeight:1.8,padding:"0 4px",marginTop:-6}}>{children}</div>
);
return (
<>
{has("set10")&&(<>
<ChartBlock title="Puls vid set 10 — jämför bara punkter med samma intervall (bpm)"

{has("ceilPct")&&(<>

<Note>Ska <em>stiga</em>. Första set som når passets högsta nivå och stannar där — punkten där arbete och återhämtning når jämvikt. Nivån är passtypsspecifik, inte din maxpuls.</Note>

{has("lastStart")&&(<>
<ChartBlock title="Startpuls sista set (bpm)"

<ChartBlock title="Snittpuls under arbetet (bpm)"

<Note>Beskrivande snarare än värderande — påverkas av både intensitet och passets längd. Räknas inom arbetsfönstret.</Note>
</>
);
})()}
</>
);
})()}

{/* ── KROPPSLOGG ── */}
<div style={{...labelStyle,fontSize:"0.65rem",paddingBottom:6,borderBottom:`1px solid ${C.border}`,marginTop:8}}>Kroppslogg</div>

<Empty text="Inga kroppsnoteringar ännu"/>:

<style>
  .hubauth { min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: "DM Mono", ui-monospace, monospace; color: #3A2010; }
  .hubauth form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 8px; }
  .hubauth h1 { font-family: Syne, sans-serif; font-weight: 800; font-size: 34px; margin-bottom: 4px; }
  .hubauth p { font-size: 13px; color: #6B5444; margin-bottom: 6px; line-height: 1.5; }
  .hubauth label { font-size: 12px; color: #6B5444; margin-top: 4px; }
  .hubauth input { font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid #D8C8B6; border-radius: 8px; background: #FDF8F3; color: #3A2010; }
  .hubauth button.main { margin-top: 10px; height: 48px; border: 0; border-radius: 8px; background: #3A2010; color: #FDF5EE; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; }
  .hubauth button.main:disabled { opacity: .6; }
  .hubauth .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .hubauth .lnk { border: 0; background: none; font: inherit; font-size: 13px; color: #C47C4C; padding: 6px 0; cursor: pointer; }
  .hubauth .msg { min-height: 18px; font-size: 13px; color: #A0402A; }
  .hubauth[hidden], .hubauth [hidden], #root[hidden] { display: none !important; }
</style>
<div class="hubauth" id="hubauth" hidden>
  <form id="hubform" autocomplete="on">
    <h1>Träningshub</h1>
    <p id="hubsub">Logga in.</p>
    <label for="hubemail">E-post</label>
    <input id="hubemail" type="email" autocomplete="username" required value="per.ringqvist@amphi.se">
    <div id="hubpwrow" style="display:flex;flex-direction:column;gap:8px">
      <label for="hubpw">Lösenord</label>
      <input id="hubpw" type="password" autocomplete="current-password" minlength="8" required>
    </div>
    <div class="msg" id="hubmsg" aria-live="polite"></div>
    <button class="main" type="submit" id="hubbtn">Logga in</button>
    <div class="row"><button class="lnk" type="button" id="hubtosignup">Första gången? Skapa konto</button><button class="lnk" type="button" id="hubtoreset">Glömt lösenordet</button></div>
  </form>
</div>
<script>
// Inloggning: träningsdatan är låst till Pers konto (samma konto som i Gläntan, samma Supabase-projekt).
(function(){
  const $=(id)=>document.getElementById(id);
  let mode='login', started=false;
  const back=location.origin+location.pathname;
  function setMode(m,msg){
    mode=m;
    $('hubpwrow').hidden=m==='reset'; $('hubpw').required=m!=='reset';
    $('hubpw').autocomplete=m==='signup'||m==='newpass'?'new-password':'current-password';
    $('hubemail').disabled=m==='newpass';
    $('hubbtn').textContent={login:'Logga in',signup:'Skapa konto',reset:'Skicka länk',newpass:'Spara nytt lösenord'}[m];
    $('hubsub').textContent={login:'Logga in.',signup:'Samma e-post och lösenord som i Gläntan, om du redan skapat konto där – logga då bara in. Annars: välj ett lösenord på minst 8 tecken och bekräfta via mailet.',reset:'Du får ett mail med en länk för att välja nytt lösenord.',newpass:'Välj ett nytt lösenord.'}[m];
    $('hubtosignup').textContent=m==='login'?'Första gången? Skapa konto':'Tillbaka till inloggning';
    $('hubtoreset').hidden=m!=='login';
    $('hubmsg').textContent=msg||'';
  }
  function show(m,msg){ $('root').hidden=true; $('hubauth').hidden=false; setMode(m||'login',msg); }
  function start(){ $('hubauth').hidden=true; $('root').hidden=false; if(started) return; started=true; window.__startHub(); }
  function errText(e){
    const msg=String((e&&e.message)||'');
    if(/Invalid login credentials/i.test(msg)) return 'Fel e-post eller lösenord.';
    if(/Email not confirmed/i.test(msg)) return 'Kontot är inte bekräftat än. Tryck på länken i mailet från Supabase.';
    if(/already registered/i.test(msg)) return 'Det finns redan ett konto. Logga in i stället.';
    if(/rate limit|too many/i.test(msg)) return 'För många försök. Vänta en stund.';
    if(/Password should/i.test(msg)) return 'Lösenordet behöver vara minst 8 tecken.';
    if(/Signups not allowed|Database error saving new user/i.test(msg)) return 'Den här e-posten kan inte skapa konto här.';
    return msg||'Något gick fel. Försök igen.';
  }
  $('hubtosignup').addEventListener('click',()=>setMode(mode==='login'?'signup':'login'));
  $('hubtoreset').addEventListener('click',()=>setMode('reset'));
  $('hubform').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const email=$('hubemail').value.trim().toLowerCase(), password=$('hubpw').value, btn=$('hubbtn');
    btn.disabled=true; $('hubmsg').textContent='';
    try{
      if(mode==='login'){ const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; }
      else if(mode==='signup'){ const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:back}}); if(error) throw error; if(!data.session) setMode('login','Klart. Öppna mailet från Supabase och tryck på länken. Logga sedan in här.'); }
      else if(mode==='reset'){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back}); if(error) throw error; setMode('login','Länken är skickad. Öppna mailet och följ den.'); }
      else if(mode==='newpass'){ const {error}=await sb.auth.updateUser({password}); if(error) throw error; $('hubpw').value=''; const {data}=await sb.auth.getSession(); if(data.session) start(); }
    }catch(err){ $('hubmsg').textContent=errText(err); }
    finally{ btn.disabled=false; }
  });
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==='PASSWORD_RECOVERY'){ show('newpass'); return; } if(session) start(); else if(ev==='SIGNED_OUT') show('login'); });
  sb.auth.getSession().then(({data})=>{ if(data.session) start(); else if(!started) show('login'); });
})();
</script>
